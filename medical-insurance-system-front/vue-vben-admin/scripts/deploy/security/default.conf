# Frontend container only; the existing external gateway keeps /yibao-api/.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/security-headers.conf;

    # Accept both gateway-stripped paths and direct /yibao/ requests.
    location = /yibao { return 302 /yibao/; }
    location ^~ /yibao/ { rewrite ^/yibao/(.*)$ /$1 last; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|mjs|css|map|ico|png|jpg|jpeg|svg|woff2?|ttf)$ {
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
}
